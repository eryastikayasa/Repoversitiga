name: Apply Gemini button names
on:
  push:
    paths:
      - '.github/workflows/apply-gemini-button-names.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Gemini tool mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/websocket/websocket_json.cpp')
          s = p.read_text()
          old = '''        "r1_on", "r1_off", "r2_on", "r2_off", "r3_on", "r3_off", "r4_on", "r4_off",\n        "fan_on", "fan_off", "fan_pwr", "fan_speed", "fan_swing", "fan_mode",\n        "mp3_mode", "mp3_play", "mp3_eq",\n        "m_led", "m_mute", "m_musik", "m_cek",\n        "cek_suhu", "cek_cahaya", '''
          new = '''        "r1", "r2", "r3", "r4",\n        "fan_pwr", "fan_speed", "fan_swing", "fan_mode",\n        "mp3_mode", "mp3_play", "mp3_eq",\n        "m_led", "m_mute", "m_musik", "m_cek",\n        "cek_suhu", "cek_cahaya", '''
          if old not in s:
              raise SystemExit('command enum block not found')
          s = s.replace(old, new, 1)
          old_prompt = '''    "Jika pengguna meminta mengontrol perangkat, gunakan fungsi control_device dengan command yang tepat. "\n    "Jika pengguna meminta kamu menampilkan ekspresi wajah, gunakan control_device dengan command Face yang sesuai. "'''
          new_prompt = '''    "Jika pengguna meminta menekan tombol perangkat, gunakan fungsi control_device dengan command tombol yang tepat. "\n    "Pahami perintah natural seperti \\\"tekan tombol play\\\", \\\"tekan tombol power kipas\\\", \\\"tekan tombol colokan harian\\\", \\\"tekan tombol colokan panjang\\\", \\\"tekan tombol saklar lampu\\\", dan \\\"tekan tombol power MP3\\\". "\n    "Pemetaan tombol: colokan harian=r1, colokan panjang=r2, saklar lampu=r3, power MP3=r4, power kipas=fan_pwr, speed kipas=fan_speed, swing kipas=fan_swing, mode kipas=fan_mode, mode MP3=mp3_mode, play=mp3_play, EQ=mp3_eq, LED=m_led, mute=m_mute, musik=m_musik, cek=m_cek. "\n    "Untuk tombol toggle, jangan gunakan command on/off; cukup tekan command tombolnya satu kali. "\n    "Jika pengguna meminta kamu menampilkan ekspresi wajah, gunakan control_device dengan command Face yang sesuai. "'''
          if old_prompt not in s:
              raise SystemExit('system prompt anchor not found')
          s = s.replace(old_prompt, new_prompt, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/websocket/websocket_json.cpp
          git commit -m 'Fix Gemini commands to use button semantics' || exit 0
          git push
