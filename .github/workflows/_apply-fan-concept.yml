name: Apply fan concept mapping
on:
  push:
    paths:
      - '.github/workflows/_apply-fan-concept.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Gemini fan semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/websocket/websocket_json.cpp')
          s = p.read_text()
          old = '    "Pahami perintah natural seperti \\\"tekan tombol play\\\", \\\"tekan tombol power kipas\\\", \\\"tekan tombol colokan harian\\\", \\\"tekan tombol colokan panjang\\\", \\\"tekan tombol saklar lampu\\\", dan \\\"tekan tombol power MP3\\\". "\n    "Pemetaan tombol: colokan harian=r1, colokan panjang=r2, saklar lampu=r3, power MP3=r4, power kipas=fan_pwr, speed kipas=fan_speed, swing kipas=fan_swing, mode kipas=fan_mode, mode MP3=mp3_mode, play=mp3_play, EQ=mp3_eq, LED=m_led, mute=m_mute, musik=m_musik, cek=m_cek. "\n    "Untuk tombol toggle, jangan gunakan command on/off; cukup tekan command tombolnya satu kali. "'
          new = '    "Pahami perintah natural seperti \\\"tekan tombol play\\\", \\\"hidupkan kipas\\\", \\\"matikan kipas\\\", \\\"naikkan kecepatan kipas\\\", \\\"turunkan kecepatan kipas\\\", \\\"ubah mode kipas\\\", \\\"tekan tombol colokan harian\\\", \\\"tekan tombol colokan panjang\\\", \\\"tekan tombol saklar lampu\\\", dan \\\"tekan tombol power MP3\\\". "\n    "Pemetaan tombol: colokan harian=r1, colokan panjang=r2, saklar lampu=r3, power MP3=r4, fan_speed=untuk menghidupkan kipas dan juga menekan tombol kecepatan kipas, fan_pwr=untuk mematikan atau toggle power kipas jika memang diperlukan, fan_swing=ayunan kipas, fan_mode=mode kipas, mode MP3=mp3_mode, play=mp3_play, EQ=mp3_eq, LED=m_led, mute=m_mute, musik=m_musik, cek=m_cek. "\n    "Jangan menganggap fan_pwr sebagai satu-satunya cara menghidupkan kipas. Pada perangkat ini, perintah hidupkan kipas harus menggunakan tombol speed (fan_speed), karena tombol power kipas tidak reliably menyalakan kipas. "\n    "Untuk perintah tombol, gunakan konsep menekan tombol fisik satu kali, bukan memaksakan status on/off. "'
          if old not in s:
              raise SystemExit('fan prompt block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/websocket/websocket_json.cpp
          git commit -m 'Fix fan command semantics to use speed button for power on' || exit 0
          git push
